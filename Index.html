<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Pocket</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap">
<style>
:root{--bg:#000;--ink:#fff;--muted:#8d8d96;--glass:linear-gradient(180deg,#2b2b2f,#151517);--edge:rgba(255,255,255,.09);--grad:linear-gradient(135deg,#8a3dff,#ff3d8b 65%,#ff4d4d);
--f:"Space Grotesk","Avenir Next","Helvetica Neue",Arial,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000}
body{color:var(--ink);font:400 17px/1.45 var(--f);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid #b27bff;outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.gb{width:48px;height:48px;border-radius:50%;border:1px solid var(--edge);background:var(--glass);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 6px 18px rgba(0,0,0,.5);display:grid;place-items:center;flex:none}
.gb:active{filter:brightness(1.3)}
.gb[aria-pressed="false"] .on,.gb[aria-pressed="true"] .off{display:none}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 4px}
.who{display:flex;align-items:center;gap:10px;padding:7px 18px 7px 8px;border-radius:999px;border:1px solid var(--edge);background:var(--glass);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.who i{width:34px;height:34px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 0 14px rgba(255,61,139,.45)}
.who i svg{width:18px;height:18px;fill:currentColor;stroke:none}
.who b{display:block;font-weight:600;font-size:15px;line-height:1.1}
.who small{display:block;color:var(--muted);font-size:11px;line-height:1.2}
#main{flex:1;overflow-y:auto;padding:6px 18px 12px;display:flex;flex-direction:column;scroll-behavior:smooth}
.hero{margin:auto -18px 0;display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:8px;animation:fadein .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadein{from{opacity:0;transform:translateY(16px)}}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.98)}}
#orbc{width:230px;height:230px}
.hero small{color:var(--muted);font-size:14px;margin-top:6px}
.hero h2{font:500 clamp(28px,8.5vw,34px)/1.12 var(--f);letter-spacing:-.02em;margin:6px 0 26px;max-width:260px}
.rows{width:100%;display:flex;flex-direction:column;gap:10px}
.row{overflow:hidden}
.track{display:flex;width:max-content;animation:slide 30s linear infinite}
.rows .row:nth-child(2) .track{animation-direction:reverse;animation-duration:36s}
.set{display:flex;gap:10px;padding-right:10px}
@keyframes slide{to{transform:translateX(-50%)}}
.chip{flex:none;display:flex;align-items:center;gap:9px;padding:10px 16px 10px 12px;border-radius:16px;border:1px solid var(--edge);background:var(--glass);box-shadow:inset 0 1px 0 rgba(255,255,255,.1);font:500 15px/1 var(--f);white-space:nowrap}
.chip svg{width:19px;height:19px;color:#d9d9e0}
.chip{transition:filter .15s,transform .15s}.chip:active{transform:scale(.95)}
.gb,.cta{transition:filter .15s,transform .15s}.gb:active,.cta:active{transform:scale(.93)}
.pins{display:flex;flex-direction:column;gap:12px;margin:6px 0 14px}
.timer{background:linear-gradient(135deg,#6a35ff,#e1368f);border-radius:28px;padding:18px 20px;display:flex;justify-content:space-between;align-items:flex-end}
.timer.done{background:linear-gradient(135deg,#ff7a2f,#ff2d55)}
.timer .t{font:600 clamp(46px,14vw,58px)/.95 var(--f);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.timer .l{font-size:14px;opacity:.85;margin-top:6px}
.timer button{border:0;background:rgba(255,255,255,.2);border-radius:999px;padding:9px 16px;font-weight:500;font-size:14px}
.list{background:#121214;border:1px solid #232328;border-radius:22px;padding:14px 18px 6px}
.list h3{font:600 17px/1 var(--f);margin:0 0 4px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #232328}
.item:first-of-type{border-top:0}
.item small{display:block;color:var(--muted);font-size:13px}
.item button{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid #6c6c75;background:none;font-size:13px}
.conv{display:flex;flex-direction:column;gap:18px}
.u{align-self:flex-end;max-width:82%;background:#232327;border:1px solid var(--edge);padding:11px 16px;border-radius:22px 22px 6px 22px;white-space:pre-wrap;word-wrap:break-word}
.b{align-self:flex-start;max-width:94%;font-size:18px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.b.think{color:var(--muted)}
.u,.b{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
.dock{padding:6px 14px 14px;display:flex;gap:10px;align-items:flex-end}
.bar{flex:1;display:flex;align-items:center;border-radius:28px;border:1px solid var(--edge);background:linear-gradient(180deg,#1d1d20,#111113);padding:3px 18px;min-height:56px}
textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:#fff;font:400 17px/1.3 var(--f);padding:14px 0;max-height:110px}
textarea::placeholder{color:#7d7d86}
.cta{width:56px;height:56px;border-radius:50%;border:0;background:var(--grad);display:grid;place-items:center;box-shadow:0 0 22px rgba(255,61,139,.45),inset 0 1px 0 rgba(255,255,255,.35);flex:none}
.cta svg.i{width:26px;height:26px;stroke-width:2}
.cta[hidden]{display:none}
#scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.62);display:block;opacity:0;pointer-events:none;transition:opacity .3s ease}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:#111113;border:1px solid #232328;border-bottom:0;border-radius:28px 28px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);max-height:75vh;overflow-y:auto}
#sheet.open{transform:none}
#scrim.open{opacity:1;pointer-events:auto}
.grab{width:42px;height:4px;border-radius:2px;background:#3a3a40;margin:2px auto 14px}
#sheet h3{margin:0 4px 10px;font:600 18px/1 var(--f)}
.srow{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;text-align:left;padding:13px 4px;border-top:1px solid #1f1f23;font:500 16px/1.2 var(--f)}
.srow:first-of-type{border-top:0}
.srow svg{color:#c9a4ff}
#voice{position:fixed;inset:0;z-index:20;background:#000;display:flex;opacity:0;visibility:hidden;pointer-events:none;transform:scale(1.05);transition:opacity .4s ease,transform .5s cubic-bezier(.2,.8,.2,1),visibility 0s .4s;flex-direction:column;overflow:hidden;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 22px)}
#voice.show{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition-delay:0s}
.vglow{position:absolute;left:-20%;right:-20%;bottom:-8%;height:58%;background:radial-gradient(55% 62% at 50% 100%,#ff2d55 0%,#b4155f 38%,rgba(90,10,80,.5) 62%,transparent 78%);transition:opacity .4s;pointer-events:none}
#voice>*{position:relative}
#voice>.vglow{position:absolute}
.vtop{display:flex;justify-content:space-between}
#wavec{width:100%;height:230px;margin-top:14px;display:block}
#clock{text-align:center;font-size:21px;color:#c4c4cc;font-variant-numeric:tabular-nums;letter-spacing:.02em}
#vcap{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font:500 clamp(20px,6vw,25px)/1.3 var(--f);padding:14px 6px;overflow-y:auto}
#vcap span{max-height:100%}
#vhint{text-align:center;font-size:15px;color:#ffd7e2;margin-bottom:14px;min-height:20px}
.vbot{display:flex;justify-content:space-between;align-items:center}
.vbot .gb{width:54px;height:54px;background:rgba(0,0,0,.45);backdrop-filter:blur(8px)}
#vmic{position:relative;width:80px;height:80px;border-radius:50%;border:0;background:var(--grad);display:grid;place-items:center;box-shadow:0 0 34px rgba(255,61,139,.7),inset 0 1px 0 rgba(255,255,255,.4)}
#vmic svg.i{width:32px;height:32px;stroke-width:2}
#vmic::before,#vmic::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid rgba(255,160,200,.55);opacity:0}
.listening #vmic::before{animation:rip 1.8s ease-out infinite}
.listening #vmic::after{animation:rip 1.8s ease-out .9s infinite}
@keyframes rip{from{transform:scale(1);opacity:.8}to{transform:scale(1.9);opacity:0}}
@media (prefers-reduced-motion:reduce){#vmic::before,#vmic::after{animation:none!important}#sheet{transition:none}.track{animation:none!important}.row{overflow-x:auto}.u,.b,.hero{animation:none!important}#voice,#scrim{transition:none}}
.mnote{color:var(--muted);font-size:14px;margin:0 0 12px}
.mcard{background:#18181b;border:1px solid #26262b;border-radius:18px;padding:12px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.mhead{display:flex;justify-content:space-between;align-items:center}
.mhead button{border:0;background:#26262b;width:32px;height:32px;border-radius:50%;margin-left:6px}
.mcard input[type=text],.mcard input[type=password],.mcard input[type=url]{background:#0c0c0e;border:1px solid #2a2a30;border-radius:12px;color:#fff;padding:11px 12px;font:inherit;font-size:15px;width:100%;outline:0}
.mon{font-size:14px;color:#c4c4cc;display:flex;gap:8px;align-items:center}
.madd{display:flex;gap:8px;margin-top:4px}
.madd select{flex:1;background:#18181b;color:#fff;border:1px solid #2a2a30;border-radius:14px;padding:11px;font:inherit;font-size:15px}
.madd button{border:0;border-radius:14px;padding:0 18px;background:var(--grad);font-weight:600}
.who{max-width:62vw}
.who small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:38vw}
.mact{display:flex;gap:8px;align-items:center}
.mact button{border:0;border-radius:12px;padding:10px 14px;background:var(--grad);font-weight:600;font-size:14px}
.mact button[data-a=first]{background:#26262b;font-weight:500}
.pri{color:#c9a4ff;font-size:13px;margin-left:auto}
.mstat{font-size:13px;min-height:16px;color:var(--muted)}
.mstat.ok{color:#5ee0a0}.mstat.bad{color:#ff7a8a}
.mdone{width:100%;margin-top:12px;border:0;border-radius:16px;padding:14px;background:#fff;color:#000;font-weight:600;font-size:16px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></symbol>
<symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></symbol>
<symbol id="i-calc" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/></symbol>
<symbol id="i-note" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h6M9 17h6"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3c.6 5 4 8.4 9 9-5 .6-8.4 4-9 9-.6-5-4-8.4-9-9 5-.6 8.4-4 9-9z"/></symbol>
<symbol id="i-trans" viewBox="0 0 24 24"><path d="M4 5h9M8.5 3v2M6 5c1 4 3 6 6 8M12 5c-1 4-3 7-7 9M13 20l4-9 4 9M14.5 17h5"/></symbol>
<symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3 11c.7.6 1 1.3 1 2h4c0-.7.3-1.4 1-2a6 6 0 0 0-3-11z"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/></symbol>
<symbol id="i-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 14c1 2 2.5 3 4 3s3-1 4-3M9 9.5v.5M15 9.5v.5"/></symbol>
<symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M5 8h14M5 16h14"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-vol" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zM15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></symbol>
<symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zM16 9l5 6M21 9l-5 6"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
</defs></svg>
<header>
  <button class="gb" id="menuBtn" aria-label="Menu"><svg class="i"><use href="#i-menu"/></svg></button>
  <button class="who" id="whoBtn" aria-label="Switch model" style="color:inherit;font:inherit;text-align:left;cursor:pointer"><i><svg viewBox="0 0 24 24"><use href="#i-spark"/></svg></i><div><b>Pocket</b><small id="mname">Pocket built-in</small></div><svg class="i" style="width:16px;height:16px;color:var(--muted)"><use href="#i-chev"/></svg></button>
  <button class="gb" id="spk" aria-label="Read replies aloud" aria-pressed="false"><svg class="i on"><use href="#i-vol"/></svg><svg class="i off"><use href="#i-mute"/></svg></button>
</header>
<div id="main">
  <div class="pins" id="pins"></div>
  <div class="hero" id="hero">
    <canvas id="orbc" aria-hidden="true"></canvas>
    <small>Hi, I’m Pocket!</small>
    <h2>How can I help you today?</h2>
    <div class="rows" id="rows"></div>
  </div>
  <div class="conv" id="conv"></div>
</div>
<div class="dock">
  <button class="gb" id="plus" aria-label="Quick actions" style="width:56px;height:56px"><svg class="i"><use href="#i-plus"/></svg></button>
  <div class="bar"><textarea id="input" rows="1" placeholder="Message…" aria-label="Message"></textarea></div>
  <button class="cta" id="send" aria-label="Send" hidden><svg class="i"><use href="#i-send"/></svg></button>
  <button class="cta" id="vbtn" aria-label="Start voice mode" hidden><svg class="i"><use href="#i-mic"/></svg></button>
</div>
<div id="scrim"></div>
<div id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><h3 id="sheetT"></h3><div id="sheetB"></div></div>
<div id="voice" role="dialog" aria-label="Voice mode">
  <div class="vglow" id="vglow"></div>
  <div class="vtop"><button class="gb" id="vback" aria-label="Back"><svg class="i"><use href="#i-back"/></svg></button><span></span></div>
  <canvas id="wavec" aria-hidden="true"></canvas>
  <div id="clock">00:00</div>
  <div id="vcap"><span id="vtext"></span></div>
  <div id="vhint"></div>
  <div class="vbot">
    <button class="gb" id="vpause" aria-label="Pause"><svg class="i"><use href="#i-pause"/></svg></button>
    <button id="vmic" aria-label="Talk"><svg class="i"><use href="#i-mic"/></svg></button>
    <button class="gb" id="vclose" aria-label="End voice mode"><svg class="i"><use href="#i-x"/></svg></button>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const conv=$('conv'),main=$('main'),input=$('input'),send=$('send'),vbtn=$('vbtn'),vtext=$('vtext'),vhint=$('vhint'),pins=$('pins'),voice=$('voice');
const ic=n=>'<svg class="i"><use href="#i-'+n+'"/></svg>';
const heroHTML=$('hero').outerHTML;
let history=[],sample=null,dict=null,busy=false,listening=false,voiceOn=false,paused=false,speakOn=false,orbState='tap',token=0,base='',vStart=0;
let timers=[],reminders=[],notes=[],tid=1;
try{reminders=JSON.parse(localStorage.getItem('pk_rem')||'[]');notes=JSON.parse(localStorage.getItem('pk_notes')||'[]');}catch(e){}
function persist(){try{localStorage.setItem('pk_rem',JSON.stringify(reminders));localStorage.setItem('pk_notes',JSON.stringify(notes));}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{s=Math.max(0,s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60,p=n=>String(n).padStart(2,'0');return (h?h+':':'')+p(m)+':'+p(x);};

const CHIPS=[
 [['timer','Timer','Set a timer for 5 minutes'],['bell','Reminder','Remind me to call Mom at 6 tonight'],['calc','Math','What’s 18% of 64?'],['note','Note','Save a note: pick up milk and eggs'],['clock','Time','What time is it?']],
 [['spark','Fun fact','Tell me a fun fact'],['trans','Translate','Translate “where is the train station” to Spanish'],['bulb','Ideas','Give me five ideas for a weekend plan'],['book','Explain','Explain black holes in three sentences'],['smile','Joke','Tell me a short joke']]];
function buildRows(){
  const r=$('rows');if(!r)return;
  r.innerHTML=CHIPS.map(row=>{const set=row.map(c=>'<button class="chip" data-q="'+esc(c[2])+'">'+ic(c[0])+c[1]+'</button>').join('');return '<div class="row"><div class="track"><div class="set">'+set+'</div><div class="set" aria-hidden="true" inert>'+set+'</div></div></div>';}).join('');
}

function renderPins(){
  let h='';const now=Date.now();
  timers.forEach(t=>{const left=Math.round((t.end-now)/1000),d=left<=0;h+='<div class="timer'+(d?' done':'')+'"><div><div class="t">'+(d?'Time’s up':fmt(left))+'</div><div class="l">'+esc(t.label)+'</div></div><button data-tx="'+t.id+'">'+(d?'Dismiss':'Cancel')+'</button></div>';});
  if(reminders.length)h+='<div class="list"><h3>Reminders</h3>'+reminders.map((r,i)=>'<div class="item"><div>'+esc(r.text)+(r.when?'<small>'+esc(r.when)+'</small>':'')+'</div><button data-rx="'+i+'" aria-label="Mark done">✓</button></div>').join('')+'</div>';
  if(notes.length)h+='<div class="list"><h3>Notes</h3>'+notes.slice(-3).reverse().map(n=>'<div class="item"><div>'+esc(n)+'</div></div>').join('')+'</div>';
  pins.innerHTML=h;
}
pins.addEventListener('click',e=>{
  const t=e.target.closest('[data-tx]'),r=e.target.closest('[data-rx]');
  if(t)timers=timers.filter(x=>x.id!==Number(t.dataset.tx));
  if(r){reminders.splice(Number(r.dataset.rx),1);persist();}
  renderPins();
});
function beep(){
  try{const c=new (window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(d=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.2;o.connect(g);g.connect(c.destination);o.start(c.currentTime+d);o.stop(c.currentTime+d+.2);});}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}
}
setInterval(()=>{
  const now=Date.now();let ch=false;
  timers.forEach(t=>{if(!t.fired&&t.end<=now){t.fired=true;ch=true;beep();add('b','Timer finished: '+t.label+'.');if(!busy&&!voiceOn)say('Your '+t.label+' is done.');}});
  if(timers.length||ch)renderPins();
  if(voiceOn){const s=Math.floor((now-vStart)/1000);$('clock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
},1000);

const tools=[
 {name:'set_timer',description:'Start a countdown timer.',inputSchema:{type:'object',properties:{seconds:{type:'number'},label:{type:'string'}},required:['seconds']},
  execute:({seconds,label})=>{seconds=Math.round(seconds);if(!(seconds>0)||seconds>86400)throw new Error('Seconds must be 1 to 86400');timers.push({id:tid++,label:label||fmt(seconds)+' timer',end:Date.now()+seconds*1000});renderPins();return {ok:true,seconds};}},
 {name:'cancel_timers',description:'Cancel all running timers.',inputSchema:{type:'object',properties:{}},execute:()=>{const n=timers.length;timers=[];renderPins();return {cancelled:n};}},
 {name:'add_reminder',description:'Add a reminder. "when" is free text like "6 PM today".',inputSchema:{type:'object',properties:{text:{type:'string'},when:{type:'string'}},required:['text']},
  execute:({text,when})=>{reminders.push({text,when:when||''});persist();renderPins();return {ok:true};}},
 {name:'list_reminders',description:'List current reminders.',inputSchema:{type:'object',properties:{}},execute:()=>reminders},
 {name:'remove_reminder',description:'Remove the reminder at a 1-based position.',inputSchema:{type:'object',properties:{position:{type:'number'}},required:['position']},

  text=(text||input.value).trim();

  if(!sample){add('b','The assistant isn’t available in this view. Open the artifact link to use it.');return;}
  input.value='';grow();busy=true;stopSpeech();
  history.push({role:'user',content:text});
  add('u',text);
  const out=add('b think','…');
  if(voiceOn){setOrb('thinking');vtext.textContent='';}
  let reply='';
  try{
    const r=await sample([{role:'user',content:'Instructions: '+SYSTEM},{role:'assistant',content:'Understood.'},...history],
      {cache:false,modelTier:'quick',tools,onText:({text})=>{out.classList.remove('think');out.textContent=text;main.scrollTop=main.scrollHeight;if(voiceOn)vtext.textContent=text;}});
    reply=r.text;out.classList.remove('think');out.textContent=reply;
    history.push({role:'assistant',content:reply});
  }catch(e){
    history.pop();out.classList.remove('think');
    reply=e&&e.code==='no_models'?'Add an API key in Menu to start chatting.':'None of your models responded. Check your keys or quota in Menu.';if(e&&e.code==='no_models')setTimeout(openModels,300);
    out.textContent=reply;
  }

  if(voiceOn){vtext.textContent=reply;setOrb('speaking');say(reply,()=>{if(voiceOn)listenTurn();});}
  else if(speakOn)say(reply);
}

  x.clearRect(0,0,W,H);

      const u=j/M;
      const w=Math.sin(u*6.283+T*1.15+t*7.3)*.55+Math.sin(u*12.566-T*.85+t*11.7)*.32+Math.sin(u*3.1+T*.5+t*3)*.25;
      const bx=(u-.5)*2*hw,r=(1+amp*w)*breathe;
      const sx=cx+bx*r*R,sy=cy+y0*R*breathe+Math.sin(u*4.2+T*.9+t*5.5)*R*.018*hw;
      j?x.lineTo(sx,sy):x.moveTo(sx,sy);

  }
  const NV=16;
  for(let i=0;i<=NV;i++){
    const u=i/NV;
    x.strokeStyle='hsla(300,90%,68%,.10)';
    x.beginPath();
    for(let j=0;j<=M;j++){
      const t=j/M,y0=(t-.5)*2,hw=Math.sqrt(Math.max(0,1-y0*y0));
      const bx=(u-.5)*2*hw;
      const w=Math.sin(t*5.1+T*1.1+u*9)*.5+Math.sin(t*8.3-T*.7+u*4)*.3;
      const r=(1+amp*w)*breathe;
      const sx=cx+bx*r*R,sy=cy+y0*R*breathe;

    }

  }
}
function drawWave(c,amp){
  if(!c||!c.clientWidth)return;fit(c);
  const x=c.getContext('2d'),W=c.width,H=c.height;
  x.clearRect(0,0,W,H);
  x.globalCompositeOperation='lighter';
  const g=x.createLinearGradient(0,0,W,0);
  g.addColorStop(0,'rgba(168,85,247,.9)');
  g.addColorStop(.5,'rgba(236,72,153,.9)');
  g.addColorStop(1,'rgba(255,90,120,.9)');
  const K=16;
  x.lineWidth=Math.max(1.2,W/300);
  x.strokeStyle=g;
  for(let s=0;s<K;s++){
    const k=s/(K-1);
    x.globalAlpha=.05+.5*Math.pow(Math.sin(Math.PI*k),1.5);
    x.beginPath();
    for(let px=0;px<=W;px+=W/120){
      const u=px/W,env=Math.pow(Math.sin(Math.PI*u),1.2);
      const y=H/2+(k-.5)*H*.34
        +env*amp*H*.26*Math.sin(u*7+T*2.1+k*3.4)
        +env*amp*H*.12*Math.sin(u*13-T*1.6+k*6);
      px?x.lineTo(px,y):x.moveTo(px,y);
    }
    x.stroke();
  }
  x.globalAlpha=1;
}
function frame(ts){

    wAmp+=(tg-wAmp)*.1;drawWave($('wavec'),wAmp);
  }
  requestAnimationFrame(frame);
}

async function callTool(tools,name,args){
  const t=(tools||[]).find(x=>x.name===name);
  try{if(!t)throw new Error('Unknown tool');return JSON.stringify(await t.execute(args||{}));}
  catch(e){return JSON.stringify({error:String(e.message||e)});}

async function runOA(m,msgs,opts){
  const url=PR[m.provider].url||m.url;
  const tools=(opts.tools||[]).map(t=>({type:'function',function:{name:t.name,description:t.description,parameters:t.inputSchema}}));
  const messages=msgs.map(x=>({role:x.role,content:x.content}));
  for(let step=0;step<6;step++){
    const body={model:m.model,messages};if(tools.length)body.tools=tools;
    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+m.key},body:JSON.stringify(body)});
    if(!res.ok){const e=new Error(PR[m.provider].name+' error '+res.status);e.status=res.status;throw e;}
    const j=await res.json(),msg=j.choices[0].message;
    if(msg.tool_calls&&msg.tool_calls.length){
      messages.push(msg);
      for(const c of msg.tool_calls){let a={};try{a=JSON.parse(c.function.arguments||'{}');}catch(e){}
        messages.push({role:'tool',tool_call_id:c.id,content:await callTool(opts.tools,c.function.name,a)});}
      continue;
    }
    const text=msg.content||'';if(opts.onText)opts.onText({text});return {text};
  }
  throw new Error('Too many tool steps');
}
async function runAN(m,msgs,opts){
  const tools=(opts.tools||[]).map(t=>({name:t.name,description:t.description,input_schema:t.inputSchema}));
  const messages=msgs.map(x=>({role:x.role,content:x.content}));
  for(let step=0;step<6;step++){
    const body={model:m.model,max_tokens:1024,messages};if(tools.length)body.tools=tools;
    const res=await fetch(PR[m.provider].url,{method:'POST',headers:{'Content-Type':'application/json','x-api-key':m.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});
    if(!res.ok){const e=new Error('Anthropic error '+res.status);e.status=res.status;throw e;}
    const j=await res.json();
    if(j.stop_reason==='tool_use'){
      messages.push({role:'assistant',content:j.content});
      const results=[];
      for(const b of j.content){if(b.type==='tool_use')results.push({type:'tool_result',tool_use_id:b.id,content:await callTool(opts.tools,b.name,b.input)});}
      messages.push({role:'user',content:results});
      continue;
    }
    const text=j.content.filter(b=>b.type==='text').map(b=>b.text).join('');
    if(opts.onText)opts.onText({text});return {text};
  }
  throw new Error('Too many tool steps');
}

      return done('Timer set for '+m[1]+' '+u.replace(/s$/,'')+(n===1?'':'s')+'. I’ll beep when it’s done, as long as this page stays open.');
    }
    if((m=/(?:done with|complete|finish|remove|delete)\s+(?:reminder\s*)?(?:number\s*)?(\d+)/.exec(t))){await tool('remove_reminder',{position:Number(m[1])});return done('Okay, I removed reminder '+m[1]+'.');}
    if(/(show|list|read|what).*reminders?/.test(t)){const r=await tool('list_reminders');return done(r.length?'You have '+r.length+(r.length===1?' reminder: ':' reminders: ')+r.map((x,i)=>(i+1)+', '+x.text+(x.when?' ('+x.when+')':'')).join('; ')+'.':'You have no reminders.');}
    if((m=/remind me\s+(?:to |about |that )?(.+)/i.exec(raw))){
      let text=m[1],when='';const w=/\s+((?:at|on|by|in|tomorrow|tonight|today|this)\b.*)$/i.exec(text);
      if(w){when=w[1];text=text.slice(0,w.index);}
      await tool('add_reminder',{text:text.replace(/[.!]+$/,''),when});
      return done('Got it. I added a reminder to '+text.replace(/[.!]+$/,'')+(when?', '+when:'')+'. It stays on screen until you tick it off.');
    }
    if((m=/(?:save|add|take|write|make)\s+(?:a\s+)?note\s*(?:that|:|to|about)?\s*(.+)/i.exec(raw))){await tool('save_note',{text:m[1]});return done('Saved your note.');}
    if(/(show|read|list|what).*notes?\b/.test(t)){const r=await tool('get_notes');return done(r.length?'Your notes: '+r.join('; ')+'.':'You haven’t saved any notes yet.');}
    if((m=new RegExp('(-?\\d+(?:\\.\\d+)?)\\s*°?\\s*('+UN+')\\b\\s*(?:to|in|into)\\s*°?\\s*('+UN+')\\b','i').exec(t))){
      const a=UMAP[m[2]],b=UMAP[m[3]],f=CONV[a]&&CONV[a][b];
      if(f)return done(m[1]+' '+UNAME[a]+' is about '+r2(f(parseFloat(m[1])))+' '+UNAME[b]+'.');
    }
    if((m=/(\d+(?:\.\d+)?)\s*%\s*of\s*(\d+(?:\.\d+)?)/.exec(t))){return done(m[1]+'% of '+m[2]+' is '+r2(parseFloat(m[1])*parseFloat(m[2])/100)+'.');}
    {
      const s=t.replace(/(\d)\s*x\s*(\d)/g,'$1*$2').replace(/plus/g,'+').replace(/minus/g,'-').replace(/multiplied by|times/g,'*').replace(/divided by|over/g,'/').replace(/to the power of/g,'^').replace(/[a-z',?!=]+/g,' ').trim();
      if(/^[\d\s+\-*/().%^]+$/.test(s)&&/\d/.test(s)&&/[+\-*/^%]/.test(s)){const r=await tool('calculate',{expression:s});return done(s.replace(/\s+/g,' ')+' equals '+r2(r.result)+'.');}
    }
    if(/\b(what|tell).*\b(time)\b/.test(t)&&!/timer/.test(t)||/^time\??$/.test(t))return done('It’s '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+'.');
    if(/\b(date|what day|today)\b/.test(t))return done('Today is '+new Date().toLocaleDateString([],{weekday:'long',month:'long',day:'numeric',year:'numeric'})+'.');
    if(/joke/.test(t))return done(pickOne(JOKES));
    if(/(fun )?fact/.test(t))return done(pickOne(FACTS));
    if(/flip a coin|coin flip|heads or tails/.test(t))return done(Math.random()<.5?'Heads.':'Tails.');
    if((m=/roll\s+(?:a\s+|an\s+)?(?:die|dice|d(\d+))/.exec(t)))return done('You rolled a '+(1+Math.floor(Math.random()*(parseInt(m[1]||'6',10)||6)))+'.');
    if((m=/random number(?: between (\d+) and (\d+))?/.exec(t))){const a=parseInt(m[1]||'1',10),b=parseInt(m[2]||'100',10);return done('How about '+(Math.min(a,b)+Math.floor(Math.random()*(Math.abs(b-a)+1)))+'?');}
    if(/^(hi|hello|hey|yo|good (morning|afternoon|evening))\b/.test(t))return done('Hi! What can I do for you?');
    if(/^(thanks|thank you|thx)/.test(t))return done('You’re welcome.');
    if(/who are you|your name|what can you do|help/.test(t))return done('I’m Pocket’s built-in assistant. I run on your device with no account needed. I can set timers, keep reminders and notes, do math and unit conversions, tell the time, flip coins, roll dice and share jokes and facts.');
  }catch(e){return done('I couldn’t do that: '+String(e.message||e)+'.');}
  return done('I’m the built-in assistant, so I only handle timers, reminders, notes, math, conversions, the time, jokes and facts. For open questions, switch to a Claude model or add an API key.');
}

function webSpeech(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;
  let rec=null,P=()=>{},F=()=>{},S=()=>{};
  return {onPartial:f=>{P=f},onFinal:f=>{F=f},onState:f=>{S=f},
   start(){return new Promise((res,rej)=>{try{rec=new SR();rec.interimResults=true;rec.lang=navigator.language||'en-US';
    rec.onresult=e=>{let fin='',part='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)fin+=r[0].transcript;else part+=r[0].transcript;}if(part)P({text:part});if(fin)F({text:fin});};
    rec.onstart=()=>S({state:'listening'});rec.onend=()=>S({state:'idle'});rec.onerror=()=>S({state:'idle'});rec.start();res();}catch(e){rej(e);}});},
   stop(){try{rec&&rec.stop();}catch(e){}return Promise.resolve();}};
}
(async()=>{
  sample=makeSample();
  
  if(!dict)dict=webSpeech();
  try{
    if(dict){
      dict.onPartial(({text})=>{const t=(base?base+' ':'')+text;input.value=t;if(voiceOn)vtext.textContent=t;});
      dict.onFinal(({text})=>{base=(base?base+' ':'')+text;input.value=base;});
      dict.onState(({state})=>{
        const was=listening;listening=state==='listening';
        if(listening){base='';input.value='';if(voiceOn){setOrb('listening');vtext.textContent='';}}
        else if(was){const t=input.value.trim();base='';if(t&&voiceOn)ask(t);else{input.value='';if(voiceOn)setOrb('tap');}}
        toggleBtns();
      });
    }
  }catch(e){}
  toggleBtns();
})();
$('whoBtn').addEventListener('click',openModels);buildRows();renderPins();toggleBtns();updateBadge();
