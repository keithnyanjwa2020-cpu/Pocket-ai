<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Pocket</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap">
<style>
:root{--bg:#000;--ink:#fff;--muted:#8d8d96;--glass:linear-gradient(180deg,#2b2b2f,#151517);--edge:rgba(255,255,255,.09);--grad:linear-gradient(135deg,#8a3dff,#ff3d8b 65%,#ff4d4d);
--f:"Space Grotesk","Avenir Next","Helvetica Neue",Arial,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000}
body{color:var(--ink);font:400 17px/1.45 var(--f);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid #b27bff;outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.gb{width:48px;height:48px;border-radius:50%;border:1px solid var(--edge);background:var(--glass);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 6px 18px rgba(0,0,0,.5);display:grid;place-items:center;flex:none}
.gb:active{filter:brightness(1.3)}
.gb[aria-pressed="false"] .on,.gb[aria-pressed="true"] .off{display:none}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 4px}
.who{display:flex;align-items:center;gap:10px;padding:7px 18px 7px 8px;border-radius:999px;border:1px solid var(--edge);background:var(--glass);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.who i{width:34px;height:34px;border-radius:50%;background:#0b0b0d;display:grid;place-items:center;color:#c28bff}
.who i svg{width:18px;height:18px;fill:currentColor;stroke:none}
.who b{display:block;font-weight:600;font-size:15px;line-height:1.1}
.who small{display:block;color:var(--muted);font-size:11px;line-height:1.2}
#main{flex:1;overflow-y:auto;padding:6px 18px 12px;display:flex;flex-direction:column;scroll-behavior:smooth}
.hero{margin:auto -18px 0;display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:8px;animation:fadein .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadein{from{opacity:0;transform:translateY(16px)}}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.98)}}
#orbc{width:230px;height:230px}
.hero small{color:var(--muted);font-size:14px;margin-top:6px}
.hero h2{font:500 clamp(28px,8.5vw,34px)/1.12 var(--f);letter-spacing:-.02em;margin:6px 0 26px;max-width:260px}
.rows{width:100%;display:flex;flex-direction:column;gap:10px}
.row{overflow:hidden}
.track{display:flex;width:max-content;animation:slide 30s linear infinite}
.rows .row:nth-child(2) .track{animation-direction:reverse;animation-duration:36s}
.set{display:flex;gap:10px;padding-right:10px}
@keyframes slide{to{transform:translateX(-50%)}}
.chip{flex:none;display:flex;align-items:center;gap:9px;padding:10px 16px 10px 12px;border-radius:16px;border:1px solid var(--edge);background:var(--glass);box-shadow:inset 0 1px 0 rgba(255,255,255,.1);font:500 15px/1 var(--f);white-space:nowrap}
.chip svg{width:19px;height:19px;color:#d9d9e0}
.chip{transition:filter .15s,transform .15s}.chip:active{transform:scale(.95)}
.gb,.cta{transition:filter .15s,transform .15s}.gb:active,.cta:active{transform:scale(.93)}
.pins{display:flex;flex-direction:column;gap:12px;margin:6px 0 14px}
.timer{background:linear-gradient(135deg,#6a35ff,#e1368f);border-radius:28px;padding:18px 20px;display:flex;justify-content:space-between;align-items:flex-end}
.timer.done{background:linear-gradient(135deg,#ff7a2f,#ff2d55)}
.timer .t{font:600 clamp(46px,14vw,58px)/.95 var(--f);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.timer .l{font-size:14px;opacity:.85;margin-top:6px}
.timer button{border:0;background:rgba(255,255,255,.2);border-radius:999px;padding:9px 16px;font-weight:500;font-size:14px}
.list{background:#121214;border:1px solid #232328;border-radius:22px;padding:14px 18px 6px}
.list h3{font:600 17px/1 var(--f);margin:0 0 4px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #232328}
.item:first-of-type{border-top:0}
.item small{display:block;color:var(--muted);font-size:13px}
.item button{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid #6c6c75;background:none;font-size:13px}
.conv{display:flex;flex-direction:column;gap:18px}
.u{align-self:flex-end;max-width:82%;background:#232327;border:1px solid var(--edge);padding:11px 16px;border-radius:22px 22px 6px 22px;white-space:pre-wrap;word-wrap:break-word}
.b{align-self:flex-start;max-width:94%;font-size:18px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.b.think{color:var(--muted)}
.u,.b{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
.dock{padding:6px 14px 14px;display:flex;gap:10px;align-items:flex-end}
.bar{flex:1;display:flex;align-items:center;border-radius:28px;border:1px solid var(--edge);background:linear-gradient(180deg,#1d1d20,#111113);padding:3px 18px;min-height:56px}
textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:#fff;font:400 17px/1.3 var(--f);padding:14px 0;max-height:110px}
textarea::placeholder{color:#7d7d86}
.cta{width:56px;height:56px;border-radius:50%;border:0;background:var(--grad);display:grid;place-items:center;box-shadow:0 0 22px rgba(255,61,139,.45),inset 0 1px 0 rgba(255,255,255,.35);flex:none}
.cta svg.i{width:26px;height:26px;stroke-width:2}
.cta[hidden]{display:none}
#scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.62);display:block;opacity:0;pointer-events:none;transition:opacity .3s ease}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:#111113;border:1px solid #232328;border-bottom:0;border-radius:28px 28px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);max-height:75vh;overflow-y:auto}
#sheet.open{transform:none}
#scrim.open{opacity:1;pointer-events:auto}
.grab{width:42px;height:4px;border-radius:2px;background:#3a3a40;margin:2px auto 14px}
#sheet h3{margin:0 4px 10px;font:600 18px/1 var(--f)}
.srow{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;text-align:left;padding:13px 4px;border-top:1px solid #1f1f23;font:500 16px/1.2 var(--f)}
.srow:first-of-type{border-top:0}
.srow svg{color:#c9a4ff}
#voice{position:fixed;inset:0;z-index:20;background:#000;display:flex;opacity:0;visibility:hidden;pointer-events:none;transform:scale(1.05);transition:opacity .4s ease,transform .5s cubic-bezier(.2,.8,.2,1),visibility 0s .4s;flex-direction:column;overflow:hidden;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 22px)}
#voice.show{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition-delay:0s}
.vglow{position:absolute;left:-20%;right:-20%;bottom:-8%;height:58%;background:radial-gradient(55% 62% at 50% 100%,#ff2d55 0%,#b4155f 38%,rgba(90,10,80,.5) 62%,transparent 78%);transition:opacity .4s;pointer-events:none}
#voice>*{position:relative}
#voice>.vglow{position:absolute}
.vtop{display:flex;justify-content:space-between}
#wavec{width:100%;height:230px;margin-top:14px;display:block}
#clock{text-align:center;font-size:21px;color:#c4c4cc;font-variant-numeric:tabular-nums;letter-spacing:.02em}
#vcap{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font:500 clamp(20px,6vw,25px)/1.3 var(--f);padding:14px 6px;overflow-y:auto}
#vcap span{max-height:100%}
#vhint{text-align:center;font-size:15px;color:#ffd7e2;margin-bottom:14px;min-height:20px}
.vbot{display:flex;justify-content:space-between;align-items:center}
.vbot .gb{width:54px;height:54px;background:rgba(0,0,0,.45);backdrop-filter:blur(8px)}
#vmic{position:relative;width:80px;height:80px;border-radius:50%;border:0;background:var(--grad);display:grid;place-items:center;box-shadow:0 0 34px rgba(255,61,139,.7),inset 0 1px 0 rgba(255,255,255,.4)}
#vmic svg.i{width:32px;height:32px;stroke-width:2}
#vmic::before,#vmic::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid rgba(255,160,200,.55);opacity:0}
.listening #vmic::before{animation:rip 1.8s ease-out infinite}
.listening #vmic::after{animation:rip 1.8s ease-out .9s infinite}
@keyframes rip{from{transform:scale(1);opacity:.8}to{transform:scale(1.9);opacity:0}}
@media (prefers-reduced-motion:reduce){#vmic::before,#vmic::after{animation:none!important}#sheet{transition:none}.track{animation:none!important}.row{overflow-x:auto}.u,.b,.hero{animation:none!important}#voice,#scrim{transition:none}}
.mnote{color:var(--muted);font-size:14px;margin:0 0 12px}
.mcard{background:#18181b;border:1px solid #26262b;border-radius:18px;padding:12px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.mhead{display:flex;justify-content:space-between;align-items:center}
.mhead button{border:0;background:#26262b;width:32px;height:32px;border-radius:50%;margin-left:6px}
.mcard input[type=text],.mcard input[type=password],.mcard input[type=url]{background:#0c0c0e;border:1px solid #2a2a30;border-radius:12px;color:#fff;padding:11px 12px;font:inherit;font-size:15px;width:100%;outline:0}
.mon{font-size:14px;color:#c4c4cc;display:flex;gap:8px;align-items:center}
.madd{display:flex;gap:8px;margin-top:4px}
.madd select{flex:1;background:#18181b;color:#fff;border:1px solid #2a2a30;border-radius:14px;padding:11px;font:inherit;font-size:15px}
.madd button{border:0;border-radius:14px;padding:0 18px;background:var(--grad);font-weight:600}
.who{max-width:62vw}
.who small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:38vw}
.mact{display:flex;gap:8px;align-items:center}
.mact button{border:0;border-radius:12px;padding:10px 14px;background:var(--grad);font-weight:600;font-size:14px}
.mact button[data-a=first]{background:#26262b;font-weight:500}
.pri{color:#c9a4ff;font-size:13px;margin-left:auto}
.mstat{font-size:13px;min-height:16px;color:var(--muted)}
.mstat.ok{color:#5ee0a0}.mstat.bad{color:#ff7a8a}
.mdone{width:100%;margin-top:12px;border:0;border-radius:16px;padding:14px;background:#fff;color:#000;font-weight:600;font-size:16px}
#offbar{margin:0 16px;padding:0 14px;border-radius:14px;background:#2a2112;border:1px solid transparent;color:#ffd7a8;font-size:14px;max-height:0;opacity:0;overflow:hidden;transition:max-height .4s ease,opacity .4s ease,margin .4s ease,padding .4s ease,border-color .4s}
body.offline #offbar{max-height:70px;opacity:1;margin:6px 16px 0;padding:10px 14px;border-color:#4a3a1a}
.f{animation:ft .65s ease both}
@keyframes ft{from{opacity:0;filter:blur(5px)}}
.dots{display:inline-flex;gap:5px;padding:9px 0}
.dots b{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dt 1s ease-in-out infinite}
.dots b:nth-child(2){animation-delay:.15s}.dots b:nth-child(3){animation-delay:.3s}
@keyframes dt{50%{opacity:.25;transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.f,.dots b{animation:none}}
.lbl{font-size:13px;color:var(--muted);margin-top:2px}
.mcard select{background:#0c0c0e;border:1px solid #2a2a30;border-radius:12px;color:#fff;padding:11px 12px;font:inherit;font-size:15px;width:100%}
.mcard input[type=range]{width:100%;accent-color:#ff3d8b}
.danger{background:#3a1519!important;color:#ff9aa5}
.hrow{display:flex;align-items:center;border-top:1px solid #1f1f23}.hrow:first-child{border-top:0}
.hopen{flex:1;text-align:left;border:0;background:none;padding:13px 4px;font:inherit}
.hopen b{display:block;font-weight:500;font-size:16px}.hopen small{color:var(--muted);font-size:12px}
.hdel{border:0;background:none;color:var(--muted);width:40px;height:40px;font-size:15px}
.acts{display:flex;gap:2px;margin-top:6px;margin-left:-8px}
.acts button{border:0;background:none;color:var(--muted);font-size:13px;padding:6px 8px;border-radius:10px;transition:background .15s,color .15s}
.acts button:active{background:#1d1d20;color:#fff}
.b.md{white-space:normal}
.md p{margin:0 0 .6em}.md ul,.md ol{margin:0 0 .6em;padding-left:1.2em}.md li{margin:.15em 0}
.md pre{background:#121214;border:1px solid #232328;border-radius:12px;padding:10px 12px;overflow-x:auto;font-size:14px;margin:0 0 .6em}
.md code{background:#18181b;border-radius:6px;padding:1px 5px;font-size:.9em}.md pre code{background:none;padding:0}
.md h4{margin:.4em 0 .3em;font-size:17px}
#keybar{margin:0 16px;padding:0 14px;border-radius:14px;background:#1a1730;border:1px solid transparent;color:#d6ccff;font-size:14px;max-height:0;opacity:0;overflow:hidden;transition:max-height .4s ease,opacity .4s ease,margin .4s ease,padding .4s ease,border-color .4s}
body.nokey:not(.offline) #keybar{max-height:90px;opacity:1;margin:6px 16px 0;padding:10px 14px;border-color:#3a3363}
#keyBtn{border:0;background:var(--grad);color:#fff;border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;margin-left:6px}
#tray{display:flex;gap:8px;padding:0 16px 6px;overflow-x:auto;scrollbar-width:none}
#tray:empty{display:none}
.att{flex:none;display:flex;align-items:center;gap:8px;background:#18181b;border:1px solid var(--edge);border-radius:16px;padding:6px 6px 6px 8px;font-size:13px}
.att img{width:42px;height:42px;object-fit:cover;border-radius:10px;display:block}
.att button{border:0;background:#2a2a2f;color:#fff;width:26px;height:26px;border-radius:50%;font-size:12px}
.u .uatt{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.u .uatt img{width:130px;max-width:100%;border-radius:12px;display:block}
.fchip{background:#2e2e33;border-radius:10px;padding:6px 10px;font-size:13px}
.genw img{width:100%;max-width:440px;border-radius:18px;display:block;animation:ft .9s ease both}
.gcap{margin-top:8px;color:var(--muted);font-size:15px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);transform:translate(-50%,10px);background:#2a2a2f;color:#fff;border:1px solid var(--edge);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:40;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></symbol>
<symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></symbol>
<symbol id="i-calc" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/></symbol>
<symbol id="i-note" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h6M9 17h6"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3c.6 5 4 8.4 9 9-5 .6-8.4 4-9 9-.6-5-4-8.4-9-9 5-.6 8.4-4 9-9z"/></symbol>
<symbol id="i-trans" viewBox="0 0 24 24"><path d="M4 5h9M8.5 3v2M6 5c1 4 3 6 6 8M12 5c-1 4-3 7-7 9M13 20l4-9 4 9M14.5 17h5"/></symbol>
<symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3 11c.7.6 1 1.3 1 2h4c0-.7.3-1.4 1-2a6 6 0 0 0-3-11z"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/></symbol>
<symbol id="i-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 14c1 2 2.5 3 4 3s3-1 4-3M9 9.5v.5M15 9.5v.5"/></symbol>
<symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M5 8h14M5 16h14"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-vol" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zM15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></symbol>
<symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zM16 9l5 6M21 9l-5 6"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></symbol>
<symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M6 14v6"/></symbol>
<symbol id="i-export" viewBox="0 0 24 24"><path d="M12 4v11M7 9l5-5 5 5M5 20h14"/></symbol>
<symbol id="i-clip" viewBox="0 0 24 24"><path d="M21 11l-9 9a5 5 0 0 1-7-7l9-9a3.5 3.5 0 0 1 5 5l-9 9a2 2 0 0 1-3-3l8-8"/></symbol>
<symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4zM12 17a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/></symbol>
<symbol id="i-image" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4M9 9v.01"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
</defs></svg>
<header>
  <button class="gb" id="menuBtn" aria-label="Menu"><svg class="i"><use href="#i-menu"/></svg></button>
  <button class="who" id="whoBtn" aria-label="Switch model" style="color:inherit;font:inherit;text-align:left;cursor:pointer"><i><svg viewBox="0 0 24 24"><use href="#i-spark"/></svg></i><div><b>Pocket</b><small id="mname">Tap to add a model</small></div><svg class="i" style="width:16px;height:16px;color:var(--muted)"><use href="#i-chev"/></svg></button>
  <button class="gb" id="spk" aria-label="Read replies aloud" aria-pressed="false"><svg class="i on"><use href="#i-vol"/></svg><svg class="i off"><use href="#i-mute"/></svg></button>
</header>
<div id="keybar" role="status">Basic mode: I can look up facts, but an API key makes me much smarter. <button id="keyBtn">Add a key</button></div>
<div id="offbar" role="status">You’re offline. Using Pocket’s built-in assistant for the basics.</div>
<div id="main">
  <div class="pins" id="pins"></div>
  <div class="hero" id="hero">
    <canvas id="orbc" aria-hidden="true"></canvas>
    <small>Hi, I’m Pocket!</small>
    <h2>How can I help you today?</h2>
    <div class="rows" id="rows"></div>
  </div>
  <div class="conv" id="conv"></div>
</div>
<div id="tray"></div>
<div class="dock">
  <button class="gb" id="plus" aria-label="Quick actions" style="width:56px;height:56px"><svg class="i"><use href="#i-plus"/></svg></button>
  <div class="bar"><textarea id="input" rows="1" placeholder="Message…" aria-label="Message"></textarea></div>
  <button class="cta" id="send" aria-label="Send" hidden><svg class="i"><use href="#i-send"/></svg></button>
  <button class="cta" id="vbtn" aria-label="Start voice mode" hidden><svg class="i"><use href="#i-mic"/></svg></button>
</div>
<input type="file" id="fileIn" multiple accept="image/*,.pdf,.txt,.md,.csv,.tsv,.json,.js,.ts,.py,.html,.css,.xml,.log,.yml,.yaml,.java,.c,.cpp,.go,.rs,.sh,.sql" hidden>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<div id="toast" role="status"></div>
<div id="scrim"></div>
<div id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><h3 id="sheetT"></h3><div id="sheetB"></div></div>
<div id="voice" role="dialog" aria-label="Voice mode">
  <div class="vglow" id="vglow"></div>
  <div class="vtop"><button class="gb" id="vback" aria-label="Back"><svg class="i"><use href="#i-back"/></svg></button><span></span></div>
  <canvas id="wavec" aria-hidden="true"></canvas>
  <div id="clock">00:00</div>
  <div id="vcap"><span id="vtext"></span></div>
  <div id="vhint"></div>
  <div class="vbot">
    <button class="gb" id="vpause" aria-label="Pause"><svg class="i"><use href="#i-pause"/></svg></button>
    <button id="vmic" aria-label="Talk"><svg class="i"><use href="#i-mic"/></svg></button>
    <button class="gb" id="vclose" aria-label="End voice mode"><svg class="i"><use href="#i-x"/></svg></button>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const conv=$('conv'),main=$('main'),input=$('input'),send=$('send'),vbtn=$('vbtn'),vtext=$('vtext'),vhint=$('vhint'),pins=$('pins'),voice=$('voice');
const ic=n=>'<svg class="i"><use href="#i-'+n+'"/></svg>';
const heroHTML=$('hero').outerHTML;
let history=[],sample=null,dict=null,busy=false,listening=false,voiceOn=false,paused=false,speakOn=false,orbState='tap',token=0,base='',vStart=0;
let timers=[],reminders=[],notes=[],tid=1;
try{reminders=JSON.parse(localStorage.getItem('pk_rem')||'[]');notes=JSON.parse(localStorage.getItem('pk_notes')||'[]');}catch(e){}
function persist(){try{localStorage.setItem('pk_rem',JSON.stringify(reminders));localStorage.setItem('pk_notes',JSON.stringify(notes));}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{s=Math.max(0,s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60,p=n=>String(n).padStart(2,'0');return (h?h+':':'')+p(m)+':'+p(x);};

const CHIPS=[
 [['timer','Timer','Set a timer for 5 minutes'],['bell','Reminder','Remind me to call Mom at 6 tonight'],['calc','Math','What’s 18% of 64?'],['note','Note','Save a note: pick up milk and eggs'],['clock','Time','What time is it?']],
 [['spark','Fun fact','Tell me a fun fact'],['trans','Translate','Translate “where is the train station” to Spanish'],['bulb','Ideas','Give me five ideas for a weekend plan'],['book','Explain','Explain black holes in three sentences'],['smile','Joke','Tell me a short joke'],['image','Image','Generate an image of a cozy cabin in the snow']]];
function buildRows(){
  const r=$('rows');if(!r)return;
  r.innerHTML=CHIPS.map(row=>{const set=row.map(c=>'<button class="chip" data-q="'+esc(c[2])+'">'+ic(c[0])+c[1]+'</button>').join('');return '<div class="row"><div class="track"><div class="set">'+set+'</div><div class="set" aria-hidden="true" inert>'+set+'</div></div></div>';}).join('');
}

function renderPins(){
  let h='';const now=Date.now();
  timers.forEach(t=>{const left=Math.round((t.end-now)/1000),d=left<=0;h+='<div class="timer'+(d?' done':'')+'"><div><div class="t">'+(d?'Time’s up':fmt(left))+'</div><div class="l">'+esc(t.label)+'</div></div><button data-tx="'+t.id+'">'+(d?'Dismiss':'Cancel')+'</button></div>';});
  if(reminders.length)h+='<div class="list"><h3>Reminders</h3>'+reminders.map((r,i)=>'<div class="item"><div>'+esc(r.text)+(r.when?'<small>'+esc(r.when)+'</small>':'')+'</div><button data-rx="'+i+'" aria-label="Mark done">✓</button></div>').join('')+'</div>';
  if(notes.length)h+='<div class="list"><h3>Notes</h3>'+notes.slice(-3).reverse().map(n=>'<div class="item"><div>'+esc(n)+'</div></div>').join('')+'</div>';
  pins.innerHTML=h;
}
pins.addEventListener('click',e=>{
  const t=e.target.closest('[data-tx]'),r=e.target.closest('[data-rx]');
  if(t)timers=timers.filter(x=>x.id!==Number(t.dataset.tx));
  if(r){reminders.splice(Number(r.dataset.rx),1);persist();}
  renderPins();
});
function beep(){
  try{const c=new (window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(d=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.2;o.connect(g);g.connect(c.destination);o.start(c.currentTime+d);o.stop(c.currentTime+d+.2);});}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}
}
setInterval(()=>{
  const now=Date.now();let ch=false;
  timers.forEach(t=>{if(!t.fired&&t.end<=now){t.fired=true;ch=true;beep();add('b','Timer finished: '+t.label+'.');if(!busy&&!voiceOn)say('Your '+t.label+' is done.');}});
  if(timers.length||ch)renderPins();
  if(voiceOn){const s=Math.floor((now-vStart)/1000);$('clock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
},1000);

const tools=[
 {name:'set_timer',description:'Start a countdown timer.',inputSchema:{type:'object',properties:{seconds:{type:'number'},label:{type:'string'}},required:['seconds']},
  execute:({seconds,label})=>{seconds=Math.round(seconds);if(!(seconds>0)||seconds>86400)throw new Error('Seconds must be 1 to 86400');timers.push({id:tid++,label:label||fmt(seconds)+' timer',end:Date.now()+seconds*1000});renderPins();return {ok:true,seconds};}},
 {name:'cancel_timers',description:'Cancel all running timers.',inputSchema:{type:'object',properties:{}},execute:()=>{const n=timers.length;timers=[];renderPins();return {cancelled:n};}},
 {name:'add_reminder',description:'Add a reminder. "when" is free text like "6 PM today".',inputSchema:{type:'object',properties:{text:{type:'string'},when:{type:'string'}},required:['text']},
  execute:({text,when})=>{reminders.push({text,when:when||''});persist();renderPins();return {ok:true};}},
 {name:'list_reminders',description:'List current reminders.',inputSchema:{type:'object',properties:{}},execute:()=>reminders},
 {name:'remove_reminder',description:'Remove the reminder at a 1-based position.',inputSchema:{type:'object',properties:{position:{type:'number'}},required:['position']},
  execute:({position})=>{const i=Math.round(position)-1;if(!reminders[i])throw new Error('No such reminder');reminders.splice(i,1);persist();renderPins();return {ok:true};}},
 {name:'save_note',description:'Save a short note.',inputSchema:{type:'object',properties:{text:{type:'string'}},required:['text']},
  execute:({text})=>{notes.push(text);persist();renderPins();return {ok:true};}},
 {name:'get_notes',description:'Read back saved notes.',inputSchema:{type:'object',properties:{}},execute:()=>notes},
 {name:'calculate',description:'Evaluate arithmetic using + - * / % ^ and parentheses.',inputSchema:{type:'object',properties:{expression:{type:'string'}},required:['expression']},
  execute:({expression})=>{const e=String(expression).replace(/\^/g,'**').replace(/×/g,'*').replace(/÷/g,'/');if(!/^[0-9+\-*/%().\s]+$/.test(e))throw new Error('Unsupported expression');const v=Function('"use strict";return ('+e+')')();if(!isFinite(v))throw new Error('Not a number');return {result:v};}},
 {name:'get_weather',description:'Get current weather and today’s forecast for a city. Leave city empty to use the device location.',inputSchema:{type:'object',properties:{city:{type:'string'}}},
  execute:async({city})=>{
    let lat,lon,place;
    if(city&&String(city).trim()){
      const g=await(await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&name='+encodeURIComponent(String(city).trim()))).json();
      if(!g.results||!g.results.length)throw new Error('I couldn’t find a place called '+city);
      lat=g.results[0].latitude;lon=g.results[0].longitude;place=g.results[0].name+(g.results[0].country?', '+g.results[0].country:'');
    }else{
      let pos;try{pos=await new Promise((res,rej)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(res,rej,{timeout:8000}):rej(new Error('none')));}catch(e){throw new Error('Tell me which city, or allow location access.');}
      lat=pos.coords.latitude;lon=pos.coords.longitude;place='Your location';
    }
    const j=await(await fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=1')).json();
    const c=j.current,d=j.daily;
    return {place,conditions:WCODE(c.weather_code),temp_c:Math.round(c.temperature_2m),feels_c:Math.round(c.apparent_temperature),wind_kmh:Math.round(c.wind_speed_10m),high_c:Math.round(d.temperature_2m_max[0]),low_c:Math.round(d.temperature_2m_min[0]),rain_chance_pct:d.precipitation_probability_max[0]};
  }},
 {name:'convert_currency',description:'Convert an amount between currencies using live exchange rates. Use ISO codes like USD, EUR, GBP, JPY.',inputSchema:{type:'object',properties:{amount:{type:'number'},from:{type:'string'},to:{type:'string'}},required:['amount','from','to']},
  execute:async({amount,from,to})=>{
    const f=String(from).toUpperCase(),t=String(to).toUpperCase();
    const j=await(await fetch('https://api.frankfurter.app/latest?amount='+Number(amount)+'&from='+f+'&to='+t)).json();
    if(!j.rates||j.rates[t]==null)throw new Error('That currency isn’t supported');
    return {amount:Number(amount),from:f,to:t,result:j.rates[t]};
  }},
 {name:'web_search',description:'Search Wikipedia for facts about people, places, events, science, history and other topics. Returns the top article summary and a few related titles.',inputSchema:{type:'object',properties:{query:{type:'string'}},required:['query']},
  execute:async({query})=>{
    const q=String(query||'').trim();if(!q)throw new Error('Empty search');
    const s=await(await fetch('https://en.wikipedia.org/w/api.php?action=query&list=search&srlimit=4&format=json&origin=*&srsearch='+encodeURIComponent(q))).json();
    const hits=(s.query&&s.query.search)||[];
    if(!hits.length)return {results:[],note:'No Wikipedia results'};
    const title=hits[0].title;
    const e=await(await fetch('https://en.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=1&explaintext=1&exsentences=5&redirects=1&format=json&origin=*&titles='+encodeURIComponent(title))).json();
    const pg=Object.values((e.query&&e.query.pages)||{})[0]||{};
    return {top:{title,summary:(pg.extract||'').slice(0,1500),url:'https://en.wikipedia.org/wiki/'+encodeURIComponent(title.replace(/ /g,'_'))},related:hits.slice(1).map(h=>h.title)};
  }},
 {name:'define_word',description:'Look up the dictionary definition of an English word.',inputSchema:{type:'object',properties:{word:{type:'string'}},required:['word']},
  execute:async({word})=>{
    const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(String(word).trim()));
    if(!r.ok)throw new Error('I couldn’t find that word');
    const j=await r.json();
    return {word:j[0].word,meanings:((j[0]&&j[0].meanings)||[]).slice(0,2).map(x=>({part:x.partOfSpeech,definition:x.definitions[0].definition}))};
  }},
 {name:'get_time',description:'Get the current local date, time and time zone.',inputSchema:{type:'object',properties:{}},
  execute:()=>({now:new Date().toLocaleString([], {dateStyle:'full',timeStyle:'short'}),timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone})}
];
const SYSTEM="You are Pocket, a voice assistant on a phone. Be brief and natural, in short plain sentences with no markdown or lists. Use your tools for timers, reminders, notes, math and the time. Timers and reminders only work while this page is open, and you cannot call people, send texts or ring real phone alarms, so say that in a few words if asked and offer a timer or reminder instead. For anything else, just answer helpfully.";

function say(t,cb){
  const my=++token;const done=()=>{if(my===token&&cb)cb();};
  if(!('speechSynthesis' in window)||!t){done();return;}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=S.rate||1;const v=S.voice&&speechSynthesis.getVoices().find(x=>x.name===S.voice);if(v)u.voice=v;u.onend=done;u.onerror=done;speechSynthesis.speak(u);}catch(e){done();}
}
function stopSpeech(){token++;try{speechSynthesis.cancel()}catch(e){}}
function setOrb(s){
  orbState=s;voice.classList.toggle('listening',s==='listening');
  $('vglow').style.opacity=s==='listening'||s==='speaking'?1:.55;
  vhint.textContent=s==='listening'?'Listening…':s==='thinking'?'Working on it…':s==='speaking'?'Tap the mic to interrupt':paused?'Paused':'Tap the mic to speak';
}
function toggleBtns(){const has=input.value.trim().length>0||atts.length>0;send.hidden=!has;vbtn.hidden=has;}
function grow(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,110)+'px';toggleBtns();}
function add(cls,t){const hr=$('hero');if(hr)hr.remove();const d=document.createElement('div');d.className=cls;d.textContent=t;conv.appendChild(d);main.scrollTop=main.scrollHeight;return d;}

async function ask(text,opt){
  text=(text||input.value).trim();
  const typed=text,myAtts=(opt&&opt.regen)?[]:atts.slice();
  if((!text&&!myAtts.length)||busy)return;
  if(!text)text='Please take a look at what I attached.';
  if(!sample){add('b','The assistant isn’t available in this view. Open the artifact link to use it.');return;}
  input.value='';grow();busy=true;stopSpeech();
  if(!(opt&&opt.regen)){history.push({role:'user',content:text,atts:myAtts});addU(typed,myAtts);atts=[];renderTray();}
  const refAtts=(opt&&opt.regen)?((history.slice().reverse().find(m=>m.role==='user')||{}).atts||[]):myAtts;
  if((opt&&opt.img)||imgMode||imgIntent(text,refAtts.some(a=>a.kind==='image'))){imgMode=false;input.placeholder='Message…';await imageFlow(text,refAtts);return;}
  const out=add('b think','…');out.innerHTML='<i class="dots"><b></b><b></b><b></b></i>';
  const ty=new Typer(out);let vty=null;
  if(voiceOn){setOrb('thinking');vtext.textContent='';vty=new Typer(vtext);}
  let reply='';
  try{
    const r=await sample([{role:'user',content:'Instructions: '+sysPrompt()},{role:'assistant',content:'Understood.'},...history],
      {cache:false,modelTier:'quick',tools,onText:({text})=>{out.classList.remove('think');ty.set(text);if(vty)vty.set(text);}});
    reply=r.text;out.classList.remove('think');ty.done=()=>finish(out,reply);ty.set(reply,true);if(vty)vty.set(reply,true);
    history.push({role:'assistant',content:reply});
  }catch(e){
    if(!(opt&&opt.regen))history.pop();out.classList.remove('think');
    reply=e&&e.code==='no_models'?'Add an API key in Menu to start chatting.':((e&&/PDFs/.test(e.message||''))?e.message:'None of your models responded. Check your keys or quota in Menu.');if(e&&e.code==='no_models')setTimeout(openModels,300);
    ty.set(reply,true);if(vty)vty.set(reply,true);
  }
  busy=false;
  if(voiceOn){if(!vty){vty=new Typer(vtext);vty.set(reply,true);}setOrb('speaking');say(reply,()=>{if(voiceOn)listenTurn();});}
  else if(speakOn)say(reply);
}

async function listenTurn(){if(!voiceOn||!dict||listening||paused)return;try{await dict.start();}catch(e){if(voiceOn)setOrb('tap');}}
function setPause(p){paused=p;$('vpause').innerHTML=ic(p?'play':'pause');$('vpause').setAttribute('aria-label',p?'Resume':'Pause');}
function openVoice(){voiceOn=true;vStart=Date.now();$('clock').textContent='00:00';setPause(false);voice.classList.add('show');vtext.textContent='';if(dict){setOrb('tap');listenTurn();}else{setOrb('listening');vhint.textContent='Mic isn’t available in this view. Type in the chat instead.';}}
async function closeVoice(){voiceOn=false;stopSpeech();voice.classList.remove('show');if(listening){try{await dict.stop()}catch(e){}}}
vbtn.addEventListener('click',openVoice);
$('vback').addEventListener('click',closeVoice);
$('vclose').addEventListener('click',closeVoice);
$('vpause').addEventListener('click',async()=>{
  if(paused){setPause(false);setOrb('tap');listenTurn();return;}
  setPause(true);stopSpeech();if(listening){try{await dict.stop()}catch(e){}}setOrb('tap');
});
$('vmic').addEventListener('click',async()=>{
  if(!dict||orbState==='thinking')return;
  if(orbState==='listening'){try{await dict.stop()}catch(e){}return;}
  setPause(false);stopSpeech();listenTurn();
});
input.addEventListener('input',grow);
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask();}});
send.addEventListener('click',()=>ask());
main.addEventListener('click',e=>{const s=e.target.closest('.chip');if(s)ask(s.dataset.q);});
$('spk').addEventListener('click',e=>{speakOn=!speakOn;e.currentTarget.setAttribute('aria-pressed',speakOn);if(!speakOn)stopSpeech();});

function newChat(){history=[];cid=null;conv.innerHTML='';stopSpeech();if(!$('hero')){conv.insertAdjacentHTML('beforebegin',heroHTML);buildRows();}applyName();}
function openSheet(title,rows){
  $('sheetT').textContent=title;
  $('sheetB').innerHTML=rows.map((r,i)=>'<button class="srow" data-i="'+i+'">'+ic(r[0])+'<span>'+esc(r[1])+'</span></button>').join('');
  $('sheetB').onclick=e=>{const b=e.target.closest('.srow');if(!b)return;closeSheet();rows[b.dataset.i][2]();};
  $('scrim').classList.add('open');$('sheet').classList.add('open');
}
function closeSheet(){$('scrim').classList.remove('open');$('sheet').classList.remove('open');}
$('scrim').addEventListener('click',closeSheet);
$('plus').addEventListener('click',()=>openSheet('Add',[
  ['clip','Attach photo or file',()=>$('fileIn').click()],
  ['camera','Take a photo',()=>$('camIn').click()],
  ['image','Generate an image',startImgMode],
  ...CHIPS.flat().map(c=>[c[0],c[2],()=>ask(c[2])])]));
$('menuBtn').addEventListener('click',()=>openSheet('Menu',[
  ['plus','New chat',newChat],
  ['clock','Chat history',openHistory],
  ['sliders','Settings',openSettings],
  ['export','Export chat',exportChat],
  ['spark','Models and keys',openModels],
  ['bell','Clear reminders',()=>{reminders=[];persist();renderPins();}],
  ['note','Clear notes',()=>{notes=[];persist();renderPins();}],
  ['timer','Cancel timers',()=>{timers=[];renderPins();}]]));

/* Visuals: iridescent mesh orb and flowing voice ribbon */
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
let T=0,last=0,oAmp=.07,wAmp=.2;
function fit(c){const d=Math.min(devicePixelRatio||1,2),w=c.clientWidth,h=c.clientHeight;if(c.width!==Math.round(w*d)){c.width=Math.round(w*d);c.height=Math.round(h*d);}return d;}
function drawOrb(c,amp){
  if(!c||!c.clientWidth)return;fit(c);
  const x=c.getContext('2d'),W=c.width,H=c.height,cx=W/2,cy=H/2,R=W*.33,N=24,M=56,ry=T*.35,rx=.5;
  x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';
  const g=x.createRadialGradient(cx,cy,R*.2,cx,cy,R*1.5);g.addColorStop(0,'rgba(150,60,255,.22)');g.addColorStop(1,'rgba(150,60,255,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.lineWidth=Math.max(1,W/230);
  const cr=Math.cos(ry),sr=Math.sin(ry),cb=Math.cos(rx),sb=Math.sin(rx);
  for(let i=1;i<N;i++){
    const th=Math.PI*i/N;let px,py,pz,py2;
    for(let j=0;j<=M;j++){
      const ph=2*Math.PI*j/M;
      const d=1+amp*(.55*Math.sin(3*ph+T*1.4+th*5)+.35*Math.sin(5*ph-T*1.1+th*3));
      const x0=Math.sin(th)*Math.cos(ph)*d,y0=Math.cos(th)*d,z0=Math.sin(th)*Math.sin(ph)*d;
      const x1=x0*cr+z0*sr,z1=-x0*sr+z0*cr,y2=y0*cb-z1*sb,z2=y0*sb+z1*cb;
      const sx=cx+x1*R,sy=cy+y2*R;
      if(j>0){const u=(y2+1)/2,h=(265+(1-u)*120)%360;x.strokeStyle='hsla('+h+',95%,62%,'+(z2>0?.75:.2)+')';x.beginPath();x.moveTo(px,py);x.lineTo(sx,sy);x.stroke();}
      px=sx;py=sy;
    }
  }
}
function drawWave(c,amp){
  if(!c||!c.clientWidth)return;fit(c);
  const x=c.getContext('2d'),W=c.width,H=c.height;x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';
  const g=x.createLinearGradient(0,0,W,0);g.addColorStop(0,'rgba(90,208,255,.55)');g.addColorStop(.5,'rgba(138,92,255,.55)');g.addColorStop(1,'rgba(255,95,210,.55)');
  x.strokeStyle=g;x.lineWidth=Math.max(1,W/420);
  for(let s=0;s<26;s++){
    const k=s/25;x.beginPath();
    for(let px=0;px<=W;px+=W/90){
      const u=px/W,env=Math.pow(Math.sin(Math.PI*u),1.1);
      const y=H/2+env*amp*H*.3*Math.sin(u*9+T*2+k*2.4)*(.6+.4*Math.sin(u*4-T*1.3+k*5))+(k-.5)*env*H*.2*Math.sin(u*5+T);
      px?x.lineTo(px,y):x.moveTo(px,y);
    }
    x.stroke();
  }
}
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(!reduce)T+=dt;
  const oc=$('orbc');
  if(oc){oAmp+=((busy?.16:.07)-oAmp)*.08;drawOrb(oc,oAmp);}
  if(voiceOn){
    const tg=orbState==='listening'?.65+.3*Math.abs(Math.sin(T*3.1)*Math.sin(T*1.3)):orbState==='speaking'?.95+.1*Math.sin(T*5):orbState==='thinking'?.35:.2;
    wAmp+=(tg-wAmp)*.1;drawWave($('wavec'),wAmp);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const PR={
 openai:{name:'OpenAI',kind:'oa',url:'https://api.openai.com/v1/chat/completions',model:'gpt-4o-mini'},
 anthropic:{name:'Anthropic',kind:'an',url:'https://api.anthropic.com/v1/messages',model:'claude-haiku-5-5'},
 gemini:{name:'Gemini',kind:'oa',url:'https://generativelanguage.googleapis.com/v1beta/openai/chat/completions',model:'gemini-3.5-flash-lite'},
 openrouter:{name:'OpenRouter',kind:'oa',url:'https://openrouter.ai/api/v1/chat/completions',model:'openai/gpt-4o-mini'},
 groq:{name:'Groq',kind:'oa',url:'https://api.groq.com/openai/v1/chat/completions',model:'llama-3.3-70b-versatile'},
 custom:{name:'Custom (OpenAI-compatible)',kind:'oa',url:'',model:''}
};
let cfg=[];try{cfg=JSON.parse(localStorage.getItem('pk_models')||'[]');}catch(e){}
function saveCfg(){try{localStorage.setItem('pk_models',JSON.stringify(cfg));}catch(e){}}
function usable(){return cfg.filter(m=>m.on&&m.key&&m.model&&(PR[m.provider].url||m.url));}
function updateBadge(name){const m=usable()[0],el=$('mname');if(el)el.textContent=!navigator.onLine?'Offline mode':name||(m?PR[m.provider].name+' · '+m.model:'Tap to add a model');document.body.classList.toggle('nokey',navigator.onLine&&!usable().length);}
async function callTool(tools,name,args){
  const t=(tools||[]).find(x=>x.name===name);
  try{if(!t)throw new Error('Unknown tool');return JSON.stringify(await t.execute(args||{}));}
  catch(e){return JSON.stringify({error:String(e.message||e)});}
}
async function runOA(m,msgs,opts){
  const url=PR[m.provider].url||m.url;
  const tools=(opts.tools||[]).map(t=>({type:'function',function:{name:t.name,description:t.description,parameters:t.inputSchema}}));
  const messages=toOAmsgs(msgs);
  for(let step=0;step<6;step++){
    const body={model:m.model,messages};if(tools.length)body.tools=tools;
    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+m.key},body:JSON.stringify(body)});
    if(!res.ok){const e=new Error(PR[m.provider].name+' error '+res.status);e.status=res.status;throw e;}
    const j=await res.json(),msg=j.choices[0].message;
    if(msg.tool_calls&&msg.tool_calls.length){
      messages.push(msg);
      for(const c of msg.tool_calls){let a={};try{a=JSON.parse(c.function.arguments||'{}');}catch(e){}
        messages.push({role:'tool',tool_call_id:c.id,content:await callTool(opts.tools,c.function.name,a)});}
      continue;
    }
    const text=msg.content||'';if(opts.onText)opts.onText({text});return {text};
  }
  throw new Error('Too many tool steps');
}
async function runAN(m,msgs,opts){
  const tools=(opts.tools||[]).map(t=>({name:t.name,description:t.description,input_schema:t.inputSchema}));
  const messages=toANmsgs(msgs);
  for(let step=0;step<6;step++){
    const body={model:m.model,max_tokens:1024,messages};if(tools.length)body.tools=tools;
    const res=await fetch(PR[m.provider].url,{method:'POST',headers:{'Content-Type':'application/json','x-api-key':m.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});
    if(!res.ok){const e=new Error('Anthropic error '+res.status);e.status=res.status;throw e;}
    const j=await res.json();
    if(j.stop_reason==='tool_use'){
      messages.push({role:'assistant',content:j.content});
      const results=[];
      for(const b of j.content){if(b.type==='tool_use')results.push({type:'tool_result',tool_use_id:b.id,content:await callTool(opts.tools,b.name,b.input)});}
      messages.push({role:'user',content:results});
      continue;
    }
    const text=j.content.filter(b=>b.type==='text').map(b=>b.text).join('');
    if(opts.onText)opts.onText({text});return {text};
  }
  throw new Error('Too many tool steps');
}
function makeSample(){
  return async(msgs,opts)=>{
    opts=opts||{};
    const list=usable(),k=attsFor(msgs),A=k>=0?msgs[k].atts:[],needPdf=A.some(a=>a.kind==='pdf'),hasAtt=A.some(a=>a.kind!=='text');
    if(!navigator.onLine||!list.length){
      if(hasAtt){const text='To read attachments I need an internet connection and an API key for a model that can see images or PDFs. Add one in Menu, then Models and keys.';if(opts.onText)opts.onText({text});return {text};}
      const r=await localAI(msgs,opts);if(navigator.onLine)updateBadge('Basic mode');return r;
    }
    let last;
    for(const m of list){
      const pv=m.provider;
      if(needPdf&&!(pv==='anthropic'||pv==='openai'||pv==='gemini'))continue;
      try{
        const run=(needPdf&&pv==='gemini')?runGM:(PR[pv].kind==='an'?runAN:runOA);
        const r=await run(m,msgs,opts);updateBadge(PR[pv].name);return r;
      }catch(e){last=e;}
    }
    if(!navigator.onLine)return localAI(msgs,opts);
    throw last||new Error('None of your models can read PDFs. Add a Gemini, Anthropic or OpenAI key.');
  };
}
async function testModel(i,card){
  const m=cfg[i],st=card.querySelector('.mstat');
  saveCfg();
  if(!m.key||!m.model||!(PR[m.provider].url||m.url)){st.className='mstat bad';st.textContent='Add a model name and key first.';return;}
  st.className='mstat';st.textContent='Testing…';
  try{await(PR[m.provider].kind==='an'?runAN:runOA)(m,[{role:'user',content:'Reply with the single word OK.'}],{});st.className='mstat ok';st.textContent='Connected. Saved.';updateBadge();}
  catch(e){st.className='mstat bad';st.textContent=e.status===401||e.status===403?'Key rejected. Check that it is correct.':e.status===429?'Quota or rate limit reached.':e.status===404?'Model or URL not found.':e.status?'Error '+e.status+'.':(window.top!==window||location.protocol==='file:'||location.origin==='null'?'This page is running inside a preview or local file that blocks outside requests. Open it from a hosted link in your phone browser.':'Could not reach '+PR[m.provider].name+' ('+(e.message||'network error')+'). Check the key and model, or try OpenRouter or OpenAI.');}
}

   '<input type="text" data-f="model" value="'+esc(m.model)+'" placeholder="Model name">'+
   '<input type="password" data-f="key" value="'+esc(m.key)+'" placeholder="API key" autocomplete="off">'+
   (m.provider==='custom'?'<input type="url" data-f="url" value="'+esc(m.url||'')+'" placeholder="https://…/v1/chat/completions">':'')+
   '<label class="mon"><input type="checkbox" data-f="on"'+(m.on?' checked':'')+'> Use this model</label>'+
   '<div class="mact"><button data-a="test">Save and test</button>'+(i>0?'<button data-a="first">Make primary</button>':'<span class="pri">Primary</span>')+'</div><div class="mstat" aria-live="polite"></div></div>').join('')+
   '<div class="madd"><select id="msel" aria-label="Provider">'+Object.keys(PR).map(k=>'<option value="'+k+'">'+esc(PR[k].name)+'</option>').join('')+'</select><button id="mbtn">Add model</button></div><button class="mdone" id="mdone">Done</button>';
}
function openModels(){
  $('sheetT').textContent='Models and keys';
  renderModels();
  const b=$('sheetB');
  b.oninput=e=>{const c=e.target.closest('.mcard'),f=e.target.dataset.f;if(!c||!f)return;cfg[c.dataset.i][f]=f==='on'?e.target.checked:e.target.value.trim();saveCfg();updateBadge();};
  b.onclick=e=>{
    const btn=e.target.closest('button');if(!btn)return;
    if(btn.id==='mdone'){closeSheet();return;}
    if(btn.id==='mbtn'){const k=$('msel').value;cfg.push({provider:k,key:'',model:PR[k].model,url:'',on:true});}
    else{const c=btn.closest('.mcard');if(!c)return;const i=Number(c.dataset.i),a=btn.dataset.a;
      if(a==='test'){testModel(i,c);return;}
      if(a==='first'&&i>0)cfg.unshift(cfg.splice(i,1)[0]);
      if(a==='rm')cfg.splice(i,1);
      if(a==='up'&&i>0)[cfg[i-1],cfg[i]]=[cfg[i],cfg[i-1]];
      if(a==='dn'&&i<cfg.length-1)[cfg[i+1],cfg[i]]=[cfg[i],cfg[i+1]];}
    saveCfg();renderModels();updateBadge();
  };
  $('scrim').classList.add('open');$('sheet').classList.add('open');
}

class Typer{
  constructor(el){this.el=el;this.full='';this.n=0;this.fin=false;this.raf=0;this.cleared=false;this.acc=0;this.last=0;}
  set(text,final){
    if(!this.cleared){this.el.textContent='';this.cleared=true;}
    this.full=String(text||'');if(final)this.fin=true;
    if(!this.raf)this.raf=requestAnimationFrame(t=>this.tick(t));
  }
  tick(ts){
    this.raf=0;
    const dt=this.last?Math.min(.1,(ts-this.last)/1000):.016;this.last=ts;
    const back=this.full.length-this.n;
    if(back>0){
      this.acc+=dt*(reduce?1e6:34+back*2.2);
      const k=Math.min(back,Math.floor(this.acc));
      if(k>0){this.acc-=k;const s=document.createElement('span');s.className='f';s.textContent=this.full.slice(this.n,this.n+k);this.el.appendChild(s);this.n+=k;main.scrollTop=main.scrollHeight;}
    }
    if(this.n<this.full.length||!this.fin)this.raf=requestAnimationFrame(x=>this.tick(x));else if(this.done){const f=this.done;this.done=null;f();}
  }
}

function md(s){
  const blocks=[];
  let h=esc(s).replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>{blocks.push('<pre><code>'+c.replace(/\n$/,'')+'</code></pre>');return '\u0000'+(blocks.length-1)+'\u0000';});
  h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[\s(])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  const out=[];let list=null,m;
  for(const ln of h.split('\n')){
    if((m=/^\s*[-*]\s+(.*)/.exec(ln))){if(list!=='ul'){if(list)out.push('</'+list+'>');out.push('<ul>');list='ul';}out.push('<li>'+m[1]+'</li>');}
    else if((m=/^\s*\d+[.)]\s+(.*)/.exec(ln))){if(list!=='ol'){if(list)out.push('</'+list+'>');out.push('<ol>');list='ol';}out.push('<li>'+m[1]+'</li>');}
    else{
      if(list){out.push('</'+list+'>');list=null;}
      if(/^\u0000\d+\u0000$/.test(ln.trim()))out.push(ln.trim());
      else if((m=/^#{1,3}\s+(.*)/.exec(ln)))out.push('<h4>'+m[1]+'</h4>');
      else if(ln.trim()!=='')out.push('<p>'+ln+'</p>');
    }
  }
  if(list)out.push('</'+list+'>');
  return out.join('').replace(/\u0000(\d+)\u0000/g,(_,i)=>blocks[i]);
}

  const k=attsFor(msgs);
  const contents=msgs.map((x,i)=>{
    const parts=[{text:expandText(x)}];
    if(i===k)for(const a of x.atts)if(a.kind!=='text')parts.push({inline_data:{mime_type:a.mime,data:a.data}});
    return {role:x.role==='assistant'?'model':'user',parts};
  });
  const j=await gpost('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(m.model)+':generateContent',m.key,{contents});
  const text=((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).filter(p=>p.text).map(p=>p.text).join('');
  if(!text)throw new Error('Empty response');
  if(opts.onText)opts.onText({text});return {text};
}
async function genImage(prompt,refs){
  const g=cfg.find(m=>m.provider==='gemini'&&m.key&&m.on)||cfg.find(m=>m.provider==='gemini'&&m.key);
  if(!g){const e=new Error('no gemini');e.code='no_gemini';throw e;}
  const parts=[{text:prompt}];
  (refs||[]).filter(a=>a.kind==='image').forEach(a=>parts.push({inline_data:{mime_type:a.mime,data:a.data}}));
  const first=S.imageModel||IMG_MODELS[0],chain=[first,...IMG_MODELS.filter(x=>x!==first)].slice(0,3);
  let lastErr;
  for(const model of chain){
    try{
      const j=await gpost('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent',g.key,{contents:[{role:'user',parts}],generationConfig:{responseModalities:['TEXT','IMAGE']}});
      const ps=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[];
      const im=ps.find(p=>p.inlineData||p.inline_data),txt=ps.filter(p=>p.text).map(p=>p.text).join(' ');
      if(!im){const e=new Error(txt||'The model didn’t return an image. It may have been blocked by safety filters.');e.status=400;throw e;}
      const d=im.inlineData||im.inline_data;
      return {mime:d.mimeType||d.mime_type||'image/png',data:d.data,text:txt};
    }catch(e){lastErr=e;if(![403,404,429,500,503].includes(e.status))break;}
  }
  throw lastErr;
}
function imgIntent(t,hasImg){
  const s=String(t).toLowerCase();
  if(/\b(generate|create|make|draw|paint|design|render|produce|imagine|show me)\b[^.?!]{0,60}\b(image|images|picture|pictures|photo|pic|drawing|illustration|painting|logo|wallpaper|poster|artwork|sketch|portrait|icon)\b/.test(s))return true;
  if(/^(imagine|draw|paint|sketch)\b/.test(s))return true;
  if(hasImg&&/\b(edit|remove the|replace the|restyle|recolou?r|colou?rize|cartoon|anime|sketch|retouch|black and white|turn (it|this|me) into|make (it|this|me) (look|into|a|an))\b/.test(s)&&!/\b(what|describe|explain|summari[sz]e|who|why|how|read|translate)\b/.test(s))return true;
  return false;
}
async function imageFlow(prompt,refs){
  const out=add('b imgb','');out.innerHTML='<i class="dots"><b></b><b></b><b></b></i>';
  let msg='';
  try{
    if(!navigator.onLine)throw new Error('You’re offline.');
    const r=await genImage(prompt,refs);
    out.innerHTML='';
    const w=document.createElement('div');w.className='genw';
    const im=new Image();im.className='gen';im.alt=prompt;im.src='data:'+r.mime+';base64,'+r.data;w.appendChild(im);out.appendChild(w);
    if(r.text){const p=document.createElement('div');p.className='gcap';p.textContent=r.text;out.appendChild(p);}
    const a=document.createElement('div');a.className='acts';a.innerHTML='<button data-a="save">Save</button><button data-a="redo">Redo</button>';out.appendChild(a);
    msg='[Generated an image: '+prompt+']';
  }catch(e){
    msg=e&&e.code==='no_gemini'?'Image generation needs a Gemini key. Add one in Menu, then Models and keys.':'I couldn’t make that image: '+((e&&e.message)||'something went wrong');
    out.classList.remove('imgb');out.textContent=msg;
  }
  history.push({role:'assistant',content:msg});saveChat();
  busy=false;main.scrollTop=main.scrollHeight;
}
function startImgMode(){imgMode=true;input.placeholder='Describe the image you want';input.focus();toast('Describe the image and send');}

function webSpeech(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;
  let rec=null,P=()=>{},F=()=>{},S=()=>{};
  return {onPartial:f=>{P=f},onFinal:f=>{F=f},onState:f=>{S=f},
   start(){return new Promise((res,rej)=>{try{rec=new SR();rec.interimResults=true;rec.lang=navigator.language||'en-US';
    rec.onresult=e=>{let fin='',part='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)fin+=r[0].transcript;else part+=r[0].transcript;}if(part)P({text:part});if(fin)F({text:fin});};
    rec.onstart=()=>S({state:'listening'});rec.onend=()=>S({state:'idle'});rec.onerror=()=>S({state:'idle'});rec.start();res();}catch(e){rej(e);}});},
   stop(){try{rec&&rec.stop();}catch(e){}return Promise.resolve();}};
}
(async()=>{
  sample=makeSample();
  
  if(!dict)dict=webSpeech();
  try{
    if(dict){
      dict.onPartial(({text})=>{const t=(base?base+' ':'')+text;input.value=t;if(voiceOn)vtext.textContent=t;});
      dict.onFinal(({text})=>{base=(base?base+' ':'')+text;input.value=base;});
      dict.onState(({state})=>{
        const was=listening;listening=state==='listening';
        if(listening){base='';input.value='';if(voiceOn){setOrb('listening');vtext.textContent='';}}
        else if(was){const t=input.value.trim();base='';if(t&&voiceOn)ask(t);else{input.value='';if(voiceOn)setOrb('tap');}}
        toggleBtns();
      });
    }
  }catch(e){}
  toggleBtns();
})();
